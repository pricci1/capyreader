name: Build PR APK

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.1

      - name: Set up Java
        uses: actions/setup-java@v4.4.0
        with:
          distribution: 'zulu'
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleFreeDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-free-debug
          path: app/build/outputs/apk/free/debug/app-free-debug.apk
          retention-days: 30

      - name: Comment PR with APK info
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = 'app/build/outputs/apk/free/debug/app-free-debug.apk';

            let size = 'unknown';
            try {
              const stats = fs.statSync(path);
              size = (stats.size / (1024 * 1024)).toFixed(2) + ' MB';
            } catch (error) {
              console.log('Could not read APK file size');
            }

            const message = `### 📱 Debug APK Built Successfully

            **APK Details:**
            - Variant: Free Debug
            - Size: ${size}
            - Artifact: \`app-free-debug\`

            You can download the APK from the **Artifacts** section in the workflow run summary.

            > **Note:** This is an unsigned debug build for testing purposes only.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
